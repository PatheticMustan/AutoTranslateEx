<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AutoTranslateEx</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>AutoTranslateEx</h1>
    <label class="switch" title="Translate pages">
      <input type="checkbox" id="enabled">
      <span class="track"><span class="thumb"></span></span>
    </label>
  </header>

  <section>
    <div class="label">Translation</div>
    <div class="tiers" id="tiers" role="radiogroup" aria-label="Translation tier"></div>
    <p class="hint" id="tier-hint"></p>
  </section>

  <section class="status">
    <div class="row"><span class="dot" id="dot"></span><span id="server">Checking server…</span></div>
    <div class="sub" id="device"></div>
    <div class="sub" id="note"></div>
  </section>

  <section class="page" id="page-section" hidden>
    <div class="row between">
      <span id="progress"></span>
      <button id="original" type="button">Show original</button>
    </div>
    <div class="row between uncertain">
      <label class="check"><input type="checkbox" id="highlight"> Highlight uncertain text</label>
      <button id="retranslate" type="button" hidden>Fix 0</button>
    </div>
    <div class="sub error" id="page-error"></div>
  </section>

  <details id="names-section" hidden>
    <summary>Names &amp; terms <span id="names-count"></span></summary>
    <p class="hint">Translated the same way on every page of this series. Names are found automatically; add your own terms (places, groups, slang) below. Edit a translation, or clear it to stop using it.</p>
    <div id="names"></div>
    <form id="add-term" class="add-term">
      <input id="term-zh" placeholder="中文" aria-label="Chinese term" required>
      <input id="term-en" placeholder="English" aria-label="English translation" required>
      <button type="submit">Add</button>
    </form>
  </details>

  <details>
    <summary>Developer</summary>
    <button id="copy-urls" type="button">Copy page URLs</button>
    <span class="sub" id="copy-result"></span>
  </details>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
